# Compose-Stack fuer Dockge auf Unraid.
# Nutzt das Image aus der lokalen Registry (docker-compose.registry.yml)
# statt "build: ." -- Dockge braucht dann keinen Zugriff auf den Quellcode.
#
# Voraussetzung: Image wurde bereits gepusht, z.B. mit:
#   build_docker.bat
#   deploy_docker.bat localhost:5000
# (kein Namespace-Argument -> Image heisst einfach "handpack")
#
# "localhost:5000" funktioniert, weil Registry und HandPack-Container auf
# demselben Unraid-Host laufen und der Registry-Port 5000 auf den Host
# gemappt ist -- der Docker-Daemon erreicht ihn ueber localhost.

services:
  handpack:
    image: localhost:5000/handpack:latest
    ports:
      - "6080:6080"        # noVNC (browser access)
    environment:
      - RESOLUTION=1920x1080
      # GPU encoder selection in the app – pick the encoder matching your GPU:
      #   hevc_nvenc  → NVIDIA  (requires NVIDIA section below)
      #   hevc_amf    → AMD     (requires AMD/Intel section below + LIBVA_DRIVER_NAME)
      #   hevc_qsv    → Intel   (requires AMD/Intel section below + LIBVA_DRIVER_NAME)
      #
      # VAAPI driver for AMD / Intel (not needed for NVIDIA):
      # - LIBVA_DRIVER_NAME=radeonsi   # AMD RX / Vega / RDNA
      # - LIBVA_DRIVER_NAME=i965       # Intel Gen 8–9 (Broadwell–Skylake)
      # - LIBVA_DRIVER_NAME=iHD        # Intel Gen 9+ (Kaby Lake and newer, incl. Arc)
    volumes:
      - /mnt/user/Filme:/input/filme
      - /mnt/user/Downloads/_handpack_output:/output
      # Persist app settings across container recreation/image updates
      # (target/CRF/encoder/audio+video mode, language, tool paths, ...).
      - /mnt/user/appdata/handpack/config:/root/.config/Kristian
    restart: unless-stopped
    shm_size: 256mb        # Qt requires /dev/shm

    # GPU passthrough – siehe docker-compose.yml (Build-Variante) fuer alle
    # auskommentierten NVIDIA/AMD/Intel/SR-IOV-Varianten zum Reinkopieren.
