[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:xvfb]
command=bash -c "Xvfb :99 -screen 0 ${RESOLUTION:-1280x800}x24 -ac"
autorestart=true
priority=10
# Neither Xvfb nor fluxbox below have state worth a graceful shutdown —
# both die with the container anyway. Without a short stopwaitsecs,
# supervisor waits its full default (10s) per program for SIGTERM to be
# honored before escalating to SIGKILL; both of these routinely ignore
# SIGTERM (no handler for it), stalling every container recreate/restart.
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
# supervisor starts programs in priority order but doesn't wait for one to
# actually be ready before the next — fluxbox routinely tries to connect
# before Xvfb has finished initializing ("Couldn't connect to XServer:99"),
# exits, and only succeeds on the autorestart retry ~1s later. Harmless
# (self-heals), but a fixed short delay avoids the failed attempt/log noise.
command=bash -c "sleep 1 && exec fluxbox"
environment=DISPLAY=":99"
autorestart=true
priority=15
startsecs=1
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :99 -nopw -listen 127.0.0.1 -forever -shared -quiet -desktop HandPack
autorestart=true
priority=20
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
autorestart=true
priority=30
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:handpack]
# umask 000: the container always runs as root (see README, needed so
# QSettings can write into the persistent /root/.config volume), so every
# file ffmpeg/dovi_tool/mkvmerge write ends up owned by root. Without a
# permissive umask that means mode 644 (read-only for anyone else) —
# whoever accesses ./output from the host (e.g. a share, another
# container) then can't write/delete those files. umask 000 makes new
# files/dirs 666/777 so any host user can.
command=bash -c "umask 000 && exec python3 /app/main.py"
environment=DISPLAY=":99",QT_QPA_PLATFORM="xcb",HANDPACK_MAXIMIZE="1"
autorestart=true
priority=40
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
